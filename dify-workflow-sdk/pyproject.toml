[project]
name = "dify-workflow-sdk"
version = "0.1.0"
description = "Standalone workflow execution SDK extracted from Dify"
authors = [
    { name = "Dify SDK Team", email = "sdk@dify.ai" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "ruff>=0.0.0",
]
ai = [
    "openai>=1.0.0",
    "anthropic>=0.0.0",
]
redis = [
    "redis>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dify_workflow_sdk"]